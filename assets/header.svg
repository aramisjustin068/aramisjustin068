<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200" font-family="'Segoe UI',-apple-system,system-ui,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="tf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7B42BC"/><stop offset="1" stop-color="#5C2E91"/>
    </linearGradient>
    <linearGradient id="k8s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#326CE5"/><stop offset="1" stop-color="#1F4FA8"/>
    </linearGradient>
  </defs>
  <rect width="880" height="200" fill="url(#bg)" rx="14"/>
  <g stroke="#1f2630" stroke-width="1">
    <line x1="0" y1="50" x2="880" y2="50"/><line x1="0" y1="100" x2="880" y2="100"/>
  </g>

  <!-- Deploy pipeline blocks scrolling -->
  <g>
    <rect x="-80" y="46" width="80" height="8" rx="4" fill="#7B42BC" opacity="0.85">
      <animate attributeName="x" from="-80" to="900" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.85;0.85;0" keyTimes="0;0.1;0.9;1" dur="5.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="-80" y="60" width="40" height="8" rx="4" fill="#326CE5" opacity="0.8">
      <animate attributeName="x" from="-80" to="900" dur="7s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.9;1" dur="7s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="-80" y="74" width="120" height="8" rx="4" fill="#7B42BC" opacity="0.7">
      <animate attributeName="x" from="-80" to="900" dur="9s" begin="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.1;0.9;1" dur="9s" begin="2.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Status lights green/red toggling -->
  <g transform="translate(640,30)">
    <circle cx="0" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.45;0.5;0.95;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#ef4444" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.45;0.5;0.95;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.35;0.85;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="22" cy="0" r="6" fill="#ef4444" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.35;0.85;1" dur="4s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="0" r="6" fill="#22c55e">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.6;0.65;0.9;1" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="44" cy="0" r="6" fill="#ef4444" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.6;0.65;0.9;1" dur="5s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Alert bell with shake -->
  <g transform="translate(740,30)">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="-12;12;-12" keyTimes="0;0.5;1" dur="0.4s" repeatCount="indefinite"/>
      <path d="M-8,6 Q-8,-10 0,-10 Q8,-10 8,6 Z" fill="#f59e0b" stroke="#d97706" stroke-width="1.5"/>
      <rect x="-10" y="6" width="20" height="3" rx="1.5" fill="#f59e0b"/>
      <circle cx="0" cy="11" r="3" fill="#f59e0b"/>
    </g>
  </g>

  <!-- K8s hexagon container icon -->
  <g transform="translate(760,158)">
    <polygon points="0,-18 15.6,-9 15.6,9 0,18 -15.6,9 -15.6,-9" fill="none" stroke="#326CE5" stroke-width="2">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-10 8.7,-5 8.7,5 0,10 -8.7,5 -8.7,-5" fill="#326CE5" opacity="0.25">
      <animate attributeName="opacity" values="0.15;0.45;0.15" dur="3s" repeatCount="indefinite"/>
    </polygon>
    <text x="0" y="4" text-anchor="middle" fill="#326CE5" font-size="10" font-weight="700">k8s</text>
  </g>

  <!-- Terraform logo blocks -->
  <g transform="translate(808,148)">
    <rect x="0" y="0" width="14" height="14" fill="#7B42BC" opacity="0.8"/>
    <rect x="16" y="0" width="14" height="14" fill="#7B42BC" opacity="0.6"/>
    <rect x="0" y="16" width="14" height="14" fill="#7B42BC" opacity="0.5"/>
  </g>

  <!-- Text -->
  <text x="40" y="118" fill="#e6edf3" font-size="36" font-weight="700">Amara Justin</text>
  <text x="42" y="148" fill="#7B42BC" font-size="18" font-weight="500">DevOps / IaC Engineer</text>
  <text x="212" y="148" fill="#8b949e" font-size="15">&#183; Terraform &#183; Kubernetes &#183; Helm &#183; Lyon</text>

  <!-- Blinking cursor -->
  <rect x="40" y="156" width="10" height="20" fill="#326CE5">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
